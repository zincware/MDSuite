# Run the unit / integration test suite, plus a linting and type-check
# baseline. Installation goes through ``uv`` for fast resolution.

name: pytest

on:
  push:
  schedule:
    - cron: '14 3 * * 1'  # at 03:14 on Monday.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.10"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install package + test extras
        run: |
          uv pip install --system -e ".[test]"
      - name: Pytest
        env:
          CUDA_VISIBLE_DEVICES: -1
          TF_CPP_MIN_LOG_LEVEL: 3
        run: |
          # Coverage is enforced: any drop below the floor fails CI. Raise
          # ``--fail-under`` as the suite improves.
          coverage run -m pytest
          coverage report --fail-under=70
      - name: Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          coveralls

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install ruff
        run: |
          uv pip install --system ruff
      - name: Ruff
        run: |
          ruff check mdsuite

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install mypy + package
        run: |
          uv pip install --system -e ".[dev]"
      - name: Mypy (baseline, permissive)
        run: |
          # Permissive baseline: ignore_missing_imports and silent
          # follow_imports are set in pyproject.toml. Treat this as an
          # early-warning step until the hint coverage grows; do not
          # fail the build on type errors yet.
          mypy mdsuite || true

  nbtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install package + test extras + nbmake
        run: |
          uv pip install --system -e ".[test]"
          uv pip install --system nbmake
      - name: Notebook test
        run: |
          pytest --nbmake ./examples --nbmake-timeout=7200

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://pandoc/core:2.9
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install package + docs extras
        run: |
          sudo apt-get install -y pandoc
          uv pip install --system -e ".[docs]"
      - name: Build documentation
        run: |
          cd ./docs
          make html
